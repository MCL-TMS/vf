name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the target server only; do not deploy files
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: 22
      VITE_API_BASE_URL: /api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        shell: bash
        run: |
          set -euo pipefail
          find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Validate deployment script
        run: |
          bash -n deploy/deploy.sh
          shellcheck deploy/deploy.sh

      - name: Package release
        run: |
          rm -rf frontend/build/.env*
          tar -czf release.tgz \
            --exclude='backend/node_modules' \
            --exclude='backend/.env' \
            --exclude='backend/.env.*' \
            --exclude='backend/debug' \
            --exclude='backend/logs' \
            --exclude='backend/uploads' \
            backend frontend/build deploy/deploy.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, x64, "${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}"]
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
    timeout-minutes: 30
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
      APP_ROOT: ${{ vars.APP_ROOT || vars.DEPLOY_PATH || '/home/evelyn.zou/apps/cms-dashboard' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || vars.APP_ROOT || '/home/evelyn.zou/apps/cms-dashboard' }}
      FRONTEND_STAGE_ROOT: ${{ vars.FRONTEND_STAGE_ROOT || vars.NGINX_WEB_ROOT || '/home/evelyn.zou/apps/cms-dashboard/frontend/build' }}
      FRONTEND_DIR: ${{ vars.NGINX_WEB_ROOT || vars.FRONTEND_DIR || '/var/www/mcl' }}
      SYSTEMD_SERVICE: ${{ vars.SYSTEMD_SERVICE || vars.BACKEND_SERVICE || 'cms_dashboard_backend' }}
      BACKEND_SERVICE: ${{ vars.SYSTEMD_SERVICE || vars.BACKEND_SERVICE || 'cms_dashboard_backend' }}
      BACKEND_ENV_FILE: ${{ vars.BACKEND_ENV_TARGET || vars.BACKEND_ENV_FILE || '/etc/cms-dashboard/backend.env' }}
      BACKEND_ENV_TARGET: ${{ vars.BACKEND_ENV_TARGET || vars.BACKEND_ENV_FILE || '/etc/cms-dashboard/backend.env' }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:3001/api/health' }}
    steps:
      - name: Prepare isolated release directory
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_dir=$(mktemp -d "${RUNNER_TEMP}/cms-release.XXXXXXXX")
          echo "RELEASE_DIR=${release_dir}" >> "$GITHUB_ENV"
          echo "path=${release_dir}" >> "$GITHUB_OUTPUT"

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ steps.release.outputs.path }}

      - name: Extract release artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RELEASE_DIR}/release.tgz" -C "$RELEASE_DIR"

      - name: Verify server prerequisites
        shell: bash
        run: |
          bash "${RELEASE_DIR}/deploy/deploy.sh" "$DEPLOY_ENVIRONMENT" "$RELEASE_DIR" --dry-run

      - name: Install script and deploy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 "${RELEASE_DIR}/deploy/deploy.sh" /home/evelyn.zou/deploy.sh
          bash /home/evelyn.zou/deploy.sh "$DEPLOY_ENVIRONMENT" "$RELEASE_DIR"

      - name: Remove temporary release
        if: always()
        shell: bash
        run: |
          if [[ -n "${RELEASE_DIR:-}" && "$RELEASE_DIR" == "$RUNNER_TEMP"/cms-release.* ]]; then
            rm -rf -- "$RELEASE_DIR"
          fi