# ====================
# MCL-CT Nginx HTTPS config
# ====================
# Before enabling:
# 1) Put frontend build files under /var/www/mcl-ct/frontend/build
# 2) Replace ssl_certificate and ssl_certificate_key with real certificate paths
# 3) Optionally split PROD and STAGE into separate files/servers if deployed on different machines

# Redirect all HTTP requests to HTTPS


server {
  listen 443 ssl;
  server_name stage-cms-dashboard.ocf.fulfillment.maersk.com.cn;
   # 使用合并后的完整证书链
   ssl_certificate     /etc/nginx/ssl/fullchain.crt;
   ssl_certificate_key /etc/nginx/ssl/cms-dashboard.ocf.fulfillment.maersk.com.cn.key;

  root /var/www/mcl;
  index index.html;

    # 正确处理 favicon
  location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

