# ====================
# MCL-CT Nginx HTTPS config
# ====================
# Before enabling:
# 1) Put frontend build files under /var/www/mcl
# 2) Replace server_name and TLS certificate paths with real values
# 3) Enable only this environment's config on the test server

# Redirect all HTTP requests to HTTPS


server {
  listen 443 ssl;
  server_name stage-cms-dashboard.ocf.fulfillment.maersk.com.cn;
   # 使用合并后的完整证书链
   ssl_certificate     /etc/nginx/ssl/fullchain.crt;
   ssl_certificate_key /etc/nginx/ssl/cms-dashboard.ocf.fulfillment.maersk.com.cn.key;

  root /var/www/mcl;
  index index.html;
  client_max_body_size 50M;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    try_files $uri =404;
  }

    # 正确处理 favicon
  location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass https://127.0.0.1:3001;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

