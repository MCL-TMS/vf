# ====================
# MCL-CT Nginx HTTPS config
# ====================
# Before enabling:
# 1) Put frontend build files under /var/www/mcl-ct/frontend/build
# 2) Replace ssl_certificate and ssl_certificate_key with real certificate paths
# 3) Optionally split PROD and STAGE into separate files/servers if deployed on different machines

# Redirect all HTTP requests to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name cms-dashboard.ocf.fulfillment.maersk.com.cn stage-cms-dashboard.ocf.fulfillment.maersk.com.cn;
  return 301 https://$host$request_uri;
}

# HTTPS server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cms-dashboard.ocf.fulfillment.maersk.com.cn stage-cms-dashboard.ocf.fulfillment.maersk.com.cn;

  root /var/www/mcl-ct/frontend/build;
  index index.html;

  ssl_certificate /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # SPA route fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy for backend API
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  client_max_body_size 50m;
}
