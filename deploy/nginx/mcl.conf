server {
    listen 443 ssl http2;
    server_name stage-cms-dashboard.ocf.fulfillment.maersk.com.cn;

    # TLS certificate (upload to /etc/ssl/mcl/ on the server)
    ssl_certificate /etc/ssl/mcl/mcl.crt;
    ssl_certificate_key /etc/ssl/mcl/mcl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS (values based on backend/.env: HSTS_MAX_AGE=31536000; includeSubDomains; preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'";

    root /var/www/mcl;
    index index.html;

    client_max_body_size 50M;

    # Static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend (backend listens on port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/mcl.access.log;
    error_log /var/log/nginx/mcl.error.log;
}

