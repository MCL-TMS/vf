<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VF Corporation 物流分析仪表板 - 专业的物流数据分析和监控平台" />
    <meta name="keywords" content="物流, 仪表板, VF Corporation, Maersk, 数据分析" />
    <title>VF 物流分析仪表板</title>
    
    <!-- Maersk 字体 (如果有的话，否则使用系统默认字体) -->
    <style>
      /* 字体加载优化 */
      html {
        font-display: swap;
      }
      
      /* 预加载优化 */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      /* 加载动画 */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #d4d4d4;
        border-top: 4px solid #42b0d5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        margin-top: 20px;
        color: #42b0d5;
        font-size: 16px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <!-- 加载动画 -->
    <div id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">正在加载 VF 物流分析仪表板...</div>
    </div>
    
    <!-- React 根容器 -->
    <div id="root"></div>
    
    <!-- 移除加载动画 -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.5s ease';
            setTimeout(function() {
              loading.remove();
            }, 500);
          }
        }, 500);
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
